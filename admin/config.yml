            widget: "select"
            options: ["normal", "large", "fullscreen"]
            default: "normal"
          - label: "S4 Image Width"
            name: "s4_image_width"
            widget: "select"
            options: ["40%", "50%", "60%", "70%"]
            default: "50%"
          - label: "S4 Image Position"
            name: "s4_image_position"
            widget: "select"
            options: ["left", "right"]
            default: "left"
          - label: "S4 Image Fit"
            name: "s4_image_fit"
            widget: "select"
