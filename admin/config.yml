backend:
  name: github
  repo: jtang8780/bcnutra
  branch: main
  base_url: https://bcnutra.com
  auth_endpoint: /auth
media_folder: "img"
public_folder: "/img"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Homepage"
        name: "index"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          # Screen 1 — Hero
          - { label: "S1 Heading", name: "s1_heading", widget: "markdown" }
          - { label: "S1 Subtext", name: "s1_subtext", widget: "markdown" }
          - { label: "S1 Image", name: "s1_image", widget: "image" }
          - label: "S1 Image Size"
            name: "s1_image_size"
            widget: "select"
            options: ["normal", "large", "fullscreen"]
            default: "normal"
          - label: "S1 Image Width"
            name: "s1_image_width"
            widget: "select"
            options: ["40%", "50%", "60%", "70%"]
            default: "50%"
          - label: "S1 Image Position"
            name: "s1_image_position"
            widget: "select"
            options: ["left", "right"]
            default: "right"
          - label: "S1 Image Fit"
            name: "s1_image_fit"
            widget: "select"
            options: ["contain", "cover"]
            default: "contain"
            hint: "contain = show full image (no crop), cover = fill area (may crop)"
          - label: "S1 Text Position"
            name: "s1_text_position"
            widget: "select"
            options: ["left", "center", "right"]
            default: "left"
          - label: "S1 Line Height"
            name: "s1_line_height"
            widget: "select"
            options: ["tight", "normal", "relaxed", "loose"]
            default: "normal"
          # Screen 2 — Life Takes A Lot
          - { label: "S2 Heading", name: "s2_heading", widget: "markdown" }
          - { label: "S2 Item 1", name: "s2_item1", widget: "string" }
          - { label: "S2 Item 2", name: "s2_item2", widget: "string" }
          - { label: "S2 Item 3", name: "s2_item3", widget: "string" }
          - { label: "S2 Item 4", name: "s2_item4", widget: "string" }
          - { label: "S2 Item 5", name: "s2_item5", widget: "string" }
          - { label: "S2 Closing Line", name: "s2_closing", widget: "markdown" }
          - { label: "S2 Image", name: "s2_image", widget: "image" }
          - label: "S2 Image Size"
            name: "s2_image_size"
            widget: "select"
            options: ["normal", "large", "fullscreen"]
            default: "normal"
          - label: "S2 Image Fit"
            name: "s2_image_fit"
            widget: "select"
            options: ["contain", "cover"]
            default: "contain"
          - label: "S2 Line Height"
            name: "s2_line_height"
            widget: "select"
            options: ["tight", "normal", "relaxed", "loose"]
            default: "normal"
          # Screen 3 — Support Your Body
          - { label: "S3 Heading", name: "s3_heading", widget: "markdown" }
          - { label: "S3 Subtext", name: "s3_subtext", widget: "markdown" }
          - { label: "S3 Button Text", name: "s3_button_text", widget: "string" }
          - { label: "S3 Button Link", name: "s3_button_link", widget: "string" }
          - label: "S3 Text Position"
            name: "s3_text_position"
            widget: "select"
            options: ["left", "center", "right"]
            default: "center"
          - label: "S3 Line Height"
            name: "s3_line_height"
            widget: "select"
            options: ["tight", "normal", "relaxed", "loose"]
            default: "normal"
          # Screen 4 — Feel Good
