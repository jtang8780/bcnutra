backend:
  name: github
  repo: jtang8780/bcnutra
  branch: main
  base_url: https://bcnutra-cms-oauth.jtang8780.workers.dev
  auth_endpoint: /auth

media_folder: "assets/img"
public_folder: "/assets/img"

site_url: https://bcnutra.com
display_url: https://bcnutra.com

collections:
  - name: "home"
    label: "Home Page"
    file: "index.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title (browser tab)", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Hero Heading", name: "hero_heading", widget: "string" }
      - { label: "Hero Subtext", name: "hero_subtext", widget: "text", required: false }
      - { label: "Hero Image", name: "hero_image", widget: "image", required: false }
      - { label: "Hero Button Text", name: "hero_button_text", widget: "string", required: false }
      - { label: "Hero Button Link", name: "hero_button_link", widget: "string", required: false }

  - name: "cortisol-health"
    label: "Cortisol Health"
    file: "cortisol-health.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Page Heading", name: "heading", widget: "string" }
      - { label: "Main Content", name: "body", widget: "markdown" }
      - { label: "Cortisol Image", name: "cortisol_image", widget: "image", required: false }

  - name: "faq"
    label: "FAQ Page"
    file: "faq.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Page Heading", name: "heading", widget: "string" }
      - label: "FAQ Items"
        name: "faq_items"
        widget: "list"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

  - name: "guarantee"
    label: "Guarantee Page"
    file: "guarantee.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Page Heading", name: "heading", widget: "string" }
      - { label: "Main Content", name: "body", widget: "markdown" }

  - name: "how-it-works"
    label: "How It Works"
    file: "how-it-works.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Page Heading", name: "heading", widget: "string" }
      - { label: "Main Content", name: "body", widget: "markdown" }
      - { label: "Product Image", name: "product_image", widget: "image", required: false }

  - name: "who-its-for"
    label: "Who It's For"
    file: "who-its-for.html"
    create: false
    delete: false
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Page Heading", name: "heading", widget: "string" }
      - { label: "Main Content", name: "body", widget: "markdown" }
