          - label: "S5 Image Width"
            name: "s5_image_width"
            widget: "select"
            options: ["40%", "50%", "60%", "70%"]
            default: "50%"
          - label: "S5 Image Fit"
            name: "s5_image_fit"
            widget: "select"
            options: ["contain", "cover"]
